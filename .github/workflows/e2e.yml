name: e2e

# Real-stack end-to-end: aws-cli -> s0-gas gateway -> MinIO backend, embedded
# OPA (regorus). Proves the security properties (including the copy-source
# authorization that closes the Ceph RGW-OPA gap, per-key multi-delete
# filtering, list narrowing, and live revocation) against an off-the-shelf S3
# client and a real S3-compatible backend, not mocks.

on:
  push:
    branches: ["main", "master", "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build gateway
        run: cargo build --bin s0

      - name: Run end-to-end suite
        run: bash tests/e2e/run.sh
        env:
          GW_BIN: ${{ github.workspace }}/target/debug/s0

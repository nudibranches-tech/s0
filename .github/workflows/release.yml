name: Release

# One git tag produces the whole release: the binary tarballs AND the container image
# hyperfluid pins. They are in one workflow on purpose — an image published without the
# matching release (or a release with no image behind its tag) is exactly the state that
# makes a consumer's pinned tag `ImagePullBackOff`, and a single tag event that either
# does all of it or fails cannot get there.
#
# The trigger is the git tag rather than a published GitHub Release: the tag is what a
# `chore(release): X.Y.Z` commit already creates, it is what `git describe` reports from a
# checkout, and it needs no click in a UI at the moment the artifact's identity is fixed.
# The Release object is an OUTPUT of this workflow, not its trigger.
#
# THIS WORKFLOW IS THE ONLY THING THAT PUBLISHES THE s0 IMAGE. There is no local
# `docker build && docker push` route, for production or for a dev cluster:
# `scripts/release-image.sh` refuses to push anywhere but here. The binary that decides
# who may read what is built from a tagged commit, by a job whose inputs are all in git,
# or it is not shipped.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Two runs for the same tag would race to publish the same name. One at a time, and never
# cancel a half-published release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY: s0

jobs:
  # ── the gate that makes a mistyped version unshippable ──────────────────────
  #
  # `Cargo.toml` is the source of truth for the version; the git tag must agree with it,
  # and every downstream job takes the version from HERE rather than from the ref it was
  # triggered by. So there is no step in which a human types a version, and a tag that
  # disagrees with the crate fails in ~5 seconds instead of publishing a `v0.3.0` release
  # full of `0.2.0` artifacts.
  version:
    name: version guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.crate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the crate version
        id: crate
        run: |
          set -euo pipefail
          version="$(bash scripts/crate-version.sh)"   # also fails if Cargo.lock disagrees
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate version: $version"

      - name: The git tag must be v<crate version>
        run: |
          set -euo pipefail
          expected="v${{ steps.crate.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match Cargo.toml ($expected)."
            echo "Bump package.version and Cargo.lock in the same commit you tag, or tag $expected." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml"

  # ── the tagged commit's own test run ────────────────────────────────────────
  #
  # `ci.yml` triggers on branches and pull requests, so without this a tag could publish a
  # commit that never ran the suite — and a tag can be pointed at any commit. It is CALLED
  # rather than copied: one definition of "s0 passes", used by both, so the release gate
  # cannot drift from the merge gate. This is what makes the image an artifact of a tested
  # commit rather than of a green-looking branch.
  test:
    name: gate
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build ${{ matrix.target }}
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --bin "$BINARY" --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          set -euo pipefail
          staging="${BINARY}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BINARY}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY }}-*.tar.gz
            ${{ env.BINARY }}-*.tar.gz.sha256

  # ── the container image hyperfluid pins ─────────────────────────────────────
  #
  # REGISTRY: ghcr.io, derived from `github.repository`. It is the only registry this
  # workflow can authenticate to without provisioning a long-lived credential (GITHUB_TOKEN
  # is scoped to this repository and expires with the job), and s0 already lives on GitHub,
  # so the image sits beside the source and the release that produced it. Introducing a
  # deploy credential for somebody else's registry, held as a secret in this repo, would be
  # a standing key to the artifact that authorizes S3 traffic — the opposite trade.
  #
  # This is the PUBLICATION point, not necessarily the pull point. A consumer either pins
  # `ghcr.io/<owner>/s0-gas:<version>` directly, or copies that exact tag into its own
  # registry — `skopeo copy` / `crane copy`, a registry-to-registry move of these bytes,
  # never a rebuild — which is what an air-gapped private cloud has to do anyway and what
  # hyperfluid's `registry.hyperfluid.cloud/hyperfluid/s3-gateway:<version>` pin expects.
  # Note that GHCR publishes a new package PRIVATE: either mark the package public once,
  # or give the pulling cluster a pull secret. See "Releasing" in README.md.
  #
  # TAGS: exactly one — the crate version. No `latest`, no floating `0.2`, no branch tag.
  # A moving tag is precisely the failure this pipeline exists to prevent: the consumer
  # pins a tag, so the tag must name one immutable set of bytes forever. Publishing a
  # second, moving name for the same image would let someone pin it by accident.
  #
  # PLATFORMS: linux/amd64 only, and that is a decision rather than an omission. Every
  # target cluster is amd64; arm64 would have to be cross-compiled under QEMU (a Rust
  # release build there is tens of minutes) or split across a second runner, and the result
  # would be an OCI index — a shape some of the mirroring paths into private registries
  # handle worse than a plain manifest. Adding it later is one line in PLATFORMS below,
  # and it should be added when there is an arm64 node to run it on, not before.
  image:
    name: publish container image
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry tag is only "immutable" because nothing overwrites it. GHCR would let a
      # re-run, or a deleted-and-recreated git tag, push different bytes under a version
      # somebody has already pinned and deployed — which is F1 (a pinned tag whose bytes
      # moved) reintroduced at the source. So: if the tag is already there, this is not a
      # release, it is an overwrite. Bump the version instead.
      #
      # A successful inspect is the only signal treated as "exists"; any failure (absent
      # package on the first ever release, transient registry error) falls through to the
      # build, which cannot succeed without a working registry anyway.
      - name: Refuse to overwrite a published version
        run: |
          set -euo pipefail
          repo="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}:${{ needs.version.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::${image} already exists — a published version is never rebuilt."
            echo "Bump package.version, commit, and tag the new version." >&2
            exit 1
          fi
          echo "$image is unpublished; proceeding"

      # The same script anyone can run locally to check that the image still builds. PUSH=1
      # is honoured only under GitHub Actions, so there is one build recipe and only one
      # place it can publish from.
      - name: Build and push
        env:
          PUSH: "1"
          REGISTRY: ghcr.io
          IMAGE_REPOSITORY: ${{ github.repository }}
          PLATFORMS: linux/amd64
          S0_DIGEST_OUT: ${{ github.workspace }}/${{ env.BINARY }}-${{ needs.version.outputs.version }}.image-digest.txt
        run: bash scripts/release-image.sh

      # The digest travels with the release for the record — mirror verification, incident
      # forensics — while the deployable reference stays the tag. Nothing in the deploy
      # path reads this file; it is evidence, not configuration.
      - name: Record the digest
        run: |
          set -euo pipefail
          file="${BINARY}-${{ needs.version.outputs.version }}.image-digest.txt"
          digest="$(cat "$file")"
          repo="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}:${{ needs.version.outputs.version }}"
          printf '%s@%s\n' "$image" "$digest" > "$file"
          {
            echo "### s0 container image"
            echo
            echo '```'
            echo "$image"
            echo "$digest"
            echo '```'
            echo
            echo "Pin in hyperfluid: \`operator.config.s3Gateway.image.tag: \"${{ needs.version.outputs.version }}\"\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-image-digest
          path: ${{ env.BINARY }}-*.image-digest.txt

  release:
    name: publish release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.image-digest.txt
          generate_release_notes: true

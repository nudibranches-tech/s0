name: ci

on:
  # `main` only on push: a topic branch is covered by its pull request, and listing both
  # would run this suite twice on every PR.
  push:
    branches: ["main"]
  pull_request:
  # Callable, so `release.yml` gates a tag on THIS definition of "s0 passes" rather than a
  # copy of it — a tag can point at any commit, which the triggers above do not cover.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: format check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --all-targets

      # Dual-engine parity gate: the embedded regorus fast path may only serve traffic
      # if it agrees with OPA over the golden decision corpus.
      #
      # The version must equal `EXPECTED_OPA_VERSION` in tests/parity.rs — the OPA major
      # version selects the rego dialect (>=1.0 parses v1, 0.x parses v0), so an oracle on
      # the wrong side of that line answers different questions than the deployed engine.
      #
      # `S0_ALLOW_NO_OPA` is deliberately NOT set anywhere in this workflow: if the install
      # below fails, the parity test panics instead of reporting a gate it never ran.
      - name: install OPA (parity gate)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.13.1"

      # Fail here, with an obvious message, rather than 200 lines later inside cargo.
      - name: verify the parity oracle
        run: opa version

      - name: test (unit + typed-hook e2e + golden corpus + dual-engine parity)
        run: cargo test --all-targets

  # S3 protocol conformance against a live backend is scaffolded in conformance.yml
  # (manual trigger, harness not yet wired). Fold it in here once it is.

  # ADR-009 T2: the SFTP codec and the PROXY v2 parser are fuzzed in CI. libFuzzer needs
  # nightly; the fuzz crate is its own workspace (fuzz/Cargo.toml), so the stable jobs
  # above never build it. Each target runs for a bounded time from an empty corpus; a
  # crash fails the job and its reproducer is uploaded.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [sftp_codec, proxy_v2_header]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      - name: install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # RUSTFLAGS is cleared: the workflow's `-D warnings` would turn a nightly-only lint
      # into a fuzz failure. Lints are the stable clippy job's business; this job finds
      # crashes.
      - name: fuzz ${{ matrix.target }} (60 s)
        env:
          RUSTFLAGS: ""
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

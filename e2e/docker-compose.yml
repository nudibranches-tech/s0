services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  opa:
    # Pinned to the production image and to `EXPECTED_OPA_VERSION` in tests/parity.rs
    # (the major version selects the rego dialect: >=1.0 is v1, 0.x is v0). Kept in
    # step by `parity::the_opa_oracle_is_pinned_to_the_production_version_everywhere`.
    image: openpolicyagent/opa:1.13.1-static
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"
      - "/policy/authz.rego"
      - "/policy/bundle.json"
    ports:
      - "8181:8181"
    volumes:
      - ../policy/gateway/authz.rego:/policy/authz.rego:ro
      - ./opa/bundle.json:/policy/bundle.json:ro

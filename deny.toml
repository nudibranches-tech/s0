# cargo-deny configuration (ADR-009: "PR 1 adds a `cargo deny` licence check").
#
# CI gates on `cargo deny check licenses` only (ci.yml, job `licenses`). The other sections
# are configured so `cargo deny check` is useful locally, but are not a merge gate yet.

[graph]
all-features = true

[licenses]
# Every licence a crate in Cargo.lock is (or may be chosen to be) distributed under. A new
# dependency under anything else fails CI until it is reviewed and added here. Permissive
# licences only: the image ships the binary, so a copyleft licence is a decision, not a
# drive-by.
#
# The BSD-3-Clause and ISC notices (curve25519-dalek, ed25519-dalek, subtle, ring, rustls,
# untrusted, ...) must ship with the image: cargo-about (about.toml, about.hbs) generates
# THIRD_PARTY_NOTICES, which the Dockerfile and the release archives carry. Keep its
# `accepted` list in step with this one.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # s0 itself.
    { crate = "s0", allow = ["BUSL-1.1"] },
]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
